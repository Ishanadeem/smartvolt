services:
  - type: web
    name: smartvolt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SMARTVOLT_LITE
        value: "1"
      - key: GROQ_API_KEY
        sync: false
